<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFB Washing Machine AR</title>

  <!-- ✅ Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QYE6P5SK18"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QYE6P5SK18', { anonymize_ip: true });
  </script>

  <!-- ✅ 3D + AR Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root{
      --bottomBarHeight: 92px; /* space for buttons bar */
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
      overflow: hidden; /* ✅ prevent scrolling */
    }

    h2 { margin: 12px 0 4px; font-size: 18px; }
    p  { margin: 0 0 8px; opacity: 0.85; font-size: 13px; }

    /* ✅ Make model viewer fit into same screen */
    model-viewer {
      width: 100%;
      height: calc(100vh - var(--bottomBarHeight) - 55px);
      background: #111;
    }

    /* ✅ Bottom Fixed Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--bottomBarHeight);
      background: rgba(15, 15, 15, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      z-index: 1000;
    }

    .btn {
      flex: 1;
      padding: 12px 10px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .btn-know {
      background: #ffcc00;
      color: black;
    }

    .btn-demo {
      background: #ffcc00;
      color: black;
    }

    .btn-ar {
      background: #00ff99;
      color: black;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* ✅ Loader Overlay */
    .loader {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 6px solid rgba(255,255,255,0.15);
      border-top: 6px solid #ffcc00;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader span {
      font-size: 14px;
      opacity: 0.85;
    }

    /* ✅ Dimensions badge */
    .dim-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 204, 0, 0.5);
      color: #ffcc00;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 8px;
      z-index: 500;
      pointer-events: none;
    }

    .btn-ar.disabled {
      opacity: 0.4;
      animation: none;
      pointer-events: none;
    }

    /* ✅ On-model dimension sketch (height/width callout lines) */
    [slot^="hotspot-dim-"] {
      display: block;
      width: 1px;
      height: 1px;
      border: none;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }

    .dim-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: visible;
    }

    .dim-line, .dim-tick {
      stroke: #ffcc00;
      stroke-width: 1.5;
    }

    .dim-label {
      fill: #ffcc00;
      font-size: 12px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      /* text-anchor is set per-label in JS (end for the height label, middle for width) —
         a CSS rule here would win over that, so it's intentionally left out. */
      paint-order: stroke;
      stroke: #000;
      stroke-width: 3px;
    }
  </style>
</head>

<body>

  <!-- ✅ Loading screen -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <span>Loading 3D model… Please wait</span>
  </div>

  <h2>IFB Washing Machine - 3D + AR</h2>
  <p>Rotate / Zoom. Tap AR to place it in your room.</p>

  <model-viewer
    id="wmModel"
    src="IFB_WM.glb"
    ar
    ar-modes="webxr scene-viewer"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="30deg"
    shadow-intensity="1"
    shadow-softness="0.8"
    environment-image="neutral"
    exposure="1.1"
    tone-mapping="commerce"
    alt="IFB Washing Machine 3D Model">
    <!-- ✅ Dimensions badge (TEMP values — replace with real datasheet H x W x D + weight, then remove the "computed live" line).
         Lives INSIDE model-viewer so it also renders as an overlay during WebXR AR sessions (only WebXR supports custom
         overlays — Scene Viewer/Quick Look hand off to a native app and can never show page content). -->
    <div class="dim-badge" id="dimBadge">-- × -- × -- cm</div>

    <!-- ✅ Anchor points for the on-model dimension sketch — one at each of the 8 bounding-box
         corners (positions set from JS after load, from the model's real bounding box). Every
         frame we read where model-viewer projected these 8 points on screen and use their
         min/max X/Y to draw the lines along the model's actual on-screen silhouette, so the
         sketch stays correctly aligned no matter what angle it's viewed from (front, top-down
         in AR, etc.) instead of being pinned to fixed points that only look right from one side. -->
    <div slot="hotspot-dim-c0" id="dimC0" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c1" id="dimC1" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c2" id="dimC2" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c3" id="dimC3" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c4" id="dimC4" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c5" id="dimC5" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c6" id="dimC6" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c7" id="dimC7" data-position="0 0 0" data-normal="0 0 1"></div>

    <svg class="dim-svg" id="dimSvg">
      <line id="hLine" class="dim-line"></line>
      <line id="hTick1" class="dim-tick"></line>
      <line id="hTick2" class="dim-tick"></line>
      <text id="hLabel" class="dim-label"></text>

      <line id="wLine" class="dim-line"></line>
      <line id="wTick1" class="dim-tick"></line>
      <line id="wTick2" class="dim-tick"></line>
      <text id="wLabel" class="dim-label"></text>
    </svg>
  </model-viewer>

  <!-- ✅ Buttons fixed at bottom (no scroll) -->
  <div class="bottom-bar">
    <a class="btn btn-ar" href="#" onclick="startAR(); return false;">
      View in AR
    </a>

    <a class="btn btn-know" href="https://www.ifbappliances.com/" target="_blank"
       onclick="gtag('event','click_know_more',{event_category:'button',event_label:'Know More'});">
      Know More
    </a>

    <a class="btn btn-demo" href="https://wa.me/918438883817" target="_blank"
       onclick="gtag('event','click_book_demo',{event_category:'button',event_label:'Book Demo WhatsApp'});">
      Book Demo
    </a>
  </div>

  <script>
    const loader = document.getElementById("loader");
    const model = document.getElementById("wmModel");
    const dimBadge = document.getElementById("dimBadge");
    const arBtn = document.querySelector(".btn-ar");

    // ⚠️ TODO: replace with real datasheet values (height x width x depth, cm) and weight (kg)
    // once you have the spec sheet. Until then this reads the live size straight off the
    // 3D model's bounding box, so it stays roughly accurate even with a placeholder model.
    const REAL_DIMENSIONS_CM = null; // e.g. { height: 85, width: 60, depth: 60, weightKg: 62 }

    function updateDimensionBadge() {
      if (REAL_DIMENSIONS_CM) {
        const { height, width, depth, weightKg } = REAL_DIMENSIONS_CM;
        dimBadge.textContent = `H${height} × W${width} × D${depth} cm` +
          (weightKg ? ` · ${weightKg} kg` : "");
        return;
      }
      // Fallback: compute live from the model's actual bounding box (meters -> cm)
      const size = model.getDimensions ? model.getDimensions() : null;
      if (size) {
        const h = Math.round(size.y * 100);
        const w = Math.round(size.x * 100);
        const d = Math.round(size.z * 100);
        dimBadge.textContent = `H${h} × W${w} × D${d} cm (est.)`;
      }
    }

    // ✅ On-model dimension sketch: places anchor points just outside the model's real
    // bounding box, then every frame reads where model-viewer projected them on screen
    // and draws blueprint-style callout lines/ticks/labels between them.
    const cornerEls = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => document.getElementById(`dimC${i}`));

    const hLine = document.getElementById("hLine");
    const hTick1 = document.getElementById("hTick1");
    const hTick2 = document.getElementById("hTick2");
    const hLabel = document.getElementById("hLabel");

    const wLine = document.getElementById("wLine");
    const wTick1 = document.getElementById("wTick1");
    const wTick2 = document.getElementById("wTick2");
    const wLabel = document.getElementById("wLabel");

    let dimLoopRunning = false;

    // updateHotspot() (not just setting data-position) is required — model-viewer only
    // reads a hotspot's initial data-position once at creation and ignores later attribute
    // mutations on the slotted element itself. The 8 corner positions are fixed in the
    // model's own local space, so this only needs to run once — model-viewer keeps their
    // on-screen projection in sync with the camera automatically every frame.
    function placeDimensionAnchors() {
      if (!model.getDimensions || !model.getBoundingBoxCenter || !model.updateHotspot) return false;
      const size = model.getDimensions();
      const center = model.getBoundingBoxCenter();
      const hx = size.x / 2, hy = size.y / 2, hz = size.z / 2;
      let i = 0;
      for (const sx of [-1, 1]) {
        for (const sy of [-1, 1]) {
          for (const sz of [-1, 1]) {
            model.updateHotspot({ name: `hotspot-dim-c${i}`, position: `${center.x + sx * hx} ${center.y + sy * hy} ${center.z + sz * hz}` });
            i++;
          }
        }
      }
      return true;
    }

    function labelFor(axis, estimateCm) {
      if (REAL_DIMENSIONS_CM) return `${axis === "h" ? "H" : "W"} ${REAL_DIMENSIONS_CM[axis === "h" ? "height" : "width"]} cm`;
      return `${axis === "h" ? "H" : "W"} ${estimateCm} cm`;
    }

    function screenPoint(el, mvRect) {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2 - mvRect.left, y: r.top + r.height / 2 - mvRect.top };
    }

    // Every frame: project the 8 bounding-box corners to screen space and take their
    // min/max X/Y. That's exactly the model's true on-screen silhouette footprint for the
    // current camera angle (front, top-down in AR, whatever) — so lines drawn along those
    // edges stay correctly attached to the model instead of cutting through it.
    function dimLoop() {
      const mvRect = model.getBoundingClientRect();
      const size = model.getDimensions();

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      cornerEls.forEach((el) => {
        const p = screenPoint(el, mvRect);
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });

      const margin = 14, tick = 6;

      // Height line: vertical, just outside the left edge of the footprint
      const lx = minX - margin;
      hLine.setAttribute("x1", lx); hLine.setAttribute("y1", minY);
      hLine.setAttribute("x2", lx); hLine.setAttribute("y2", maxY);
      hTick1.setAttribute("x1", lx - tick); hTick1.setAttribute("y1", minY);
      hTick1.setAttribute("x2", lx + tick); hTick1.setAttribute("y2", minY);
      hTick2.setAttribute("x1", lx - tick); hTick2.setAttribute("y1", maxY);
      hTick2.setAttribute("x2", lx + tick); hTick2.setAttribute("y2", maxY);
      hLabel.setAttribute("x", lx - 8);
      hLabel.setAttribute("y", (minY + maxY) / 2);
      hLabel.setAttribute("text-anchor", "end");
      hLabel.textContent = labelFor("h", Math.round(size.y * 100));

      // Width line: horizontal, just outside the bottom edge of the footprint
      const by = maxY + margin;
      wLine.setAttribute("x1", minX); wLine.setAttribute("y1", by);
      wLine.setAttribute("x2", maxX); wLine.setAttribute("y2", by);
      wTick1.setAttribute("x1", minX); wTick1.setAttribute("y1", by - tick);
      wTick1.setAttribute("x2", minX); wTick1.setAttribute("y2", by + tick);
      wTick2.setAttribute("x1", maxX); wTick2.setAttribute("y1", by - tick);
      wTick2.setAttribute("x2", maxX); wTick2.setAttribute("y2", by + tick);
      wLabel.setAttribute("x", (minX + maxX) / 2);
      wLabel.setAttribute("y", by + 16);
      wLabel.setAttribute("text-anchor", "middle");
      wLabel.textContent = labelFor("w", Math.round(size.x * 100));

      requestAnimationFrame(dimLoop);
    }

    model.addEventListener("load", () => {
      loader.style.display = "none";
      updateDimensionBadge();
      if (placeDimensionAnchors() && !dimLoopRunning) {
        dimLoopRunning = true;
        requestAnimationFrame(dimLoop);
      }
      gtag('event','model_loaded',{event_category:'3d',event_label:'IFB_WM'});
    });

    model.addEventListener("ar-status", (event) => {
      if (event.detail.status === "session-started") {
        gtag('event','ar_session_started',{event_category:'AR',event_label:'IFB_WM'});
      }
      if (event.detail.status === "not-presenting") {
        gtag('event','ar_session_ended',{event_category:'AR',event_label:'IFB_WM'});
      }
      if (event.detail.status === "failed") {
        gtag('event','ar_failed',{event_category:'AR',event_label:'IFB_WM'});
        alert("AR couldn't start. Point your camera at a flat, well-lit surface (like a floor) and try again.");
      }
    });

    // Grey out the AR button on devices/browsers that can't do AR at all
    // (desktop, unsupported browsers, iOS Safari without a usdz file, etc.)
    window.addEventListener("load", () => {
      setTimeout(() => {
        if (model.canActivateAR === false) {
          arBtn.classList.add("disabled");
          arBtn.textContent = "AR not supported here";
        }
      }, 800); // model-viewer needs a beat to finish its AR capability check
    });

    function startAR(){
      if (arBtn.classList.contains("disabled")) return;
      gtag('event','click_ar_button',{event_category:'button',event_label:'AR CTA'});
      model.activateAR();
    }
  </script>

</body>
</html>
