<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFB Washing Machine AR</title>

  <!-- ✅ Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QYE6P5SK18"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QYE6P5SK18', { anonymize_ip: true });
  </script>

  <!-- ✅ 3D + AR Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root{
      --bottomBarHeight: 92px; /* space for buttons bar */
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
      overflow: hidden; /* ✅ prevent scrolling */
    }

    h2 { margin: 12px 0 4px; font-size: 18px; }
    p  { margin: 0 0 8px; opacity: 0.85; font-size: 13px; }

    /* ✅ Make model viewer fit into same screen */
    model-viewer {
      width: 100%;
      height: calc(100vh - var(--bottomBarHeight) - 55px);
      background: #111;
    }

    /* ✅ Bottom Fixed Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--bottomBarHeight);
      background: rgba(15, 15, 15, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      z-index: 1000;
    }

    .btn {
      flex: 1;
      padding: 12px 10px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .btn-know {
      background: #ffcc00;
      color: black;
    }

    .btn-demo {
      background: #ffcc00;
      color: black;
    }

    .btn-ar {
      background: #00ff99;
      color: black;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* ✅ Loader Overlay */
    .loader {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 6px solid rgba(255,255,255,0.15);
      border-top: 6px solid #ffcc00;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader span {
      font-size: 14px;
      opacity: 0.85;
    }

    /* ✅ Dimensions badge */
    .dim-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 204, 0, 0.5);
      color: #ffcc00;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 8px;
      z-index: 500;
      pointer-events: none;
    }

    .btn-ar.disabled {
      opacity: 0.4;
      animation: none;
      pointer-events: none;
    }

    /* ✅ On-model dimension sketch (height/width callout lines) */
    [slot^="hotspot-dim-"] {
      display: block;
      width: 1px;
      height: 1px;
      border: none;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }

    .dim-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: visible;
    }

    .dim-line, .dim-tick {
      stroke: #ffcc00;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* Thin leader lines running from the product edge out to the dimension line (CAD/IKEA style) */
    .dim-ext {
      stroke: #ffcc00;
      stroke-width: 1;
      opacity: 0.55;
    }

    .dim-label {
      fill: #ffcc00;
      font-size: 12px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      /* text-anchor is set per-label in JS (end for the height label, middle for width) —
         a CSS rule here would win over that, so it's intentionally left out. */
      paint-order: stroke;
      stroke: #000;
      stroke-width: 3px;
    }
  </style>
</head>

<body>

  <!-- ✅ Loading screen -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <span>Loading 3D model… Please wait</span>
  </div>

  <h2>IFB Washing Machine - 3D + AR</h2>
  <p>Rotate / Zoom. Tap AR to place it in your room.</p>

  <model-viewer
    id="wmModel"
    src="IFB_WM.glb"
    ar
    ar-modes="webxr scene-viewer"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="30deg"
    shadow-intensity="1"
    shadow-softness="0.8"
    environment-image="neutral"
    exposure="1.1"
    tone-mapping="commerce"
    alt="IFB Washing Machine 3D Model">
    <!-- ✅ Dimensions badge (TEMP values — replace with real datasheet H x W x D + weight, then remove the "computed live" line).
         Lives INSIDE model-viewer so it also renders as an overlay during WebXR AR sessions (only WebXR supports custom
         overlays — Scene Viewer/Quick Look hand off to a native app and can never show page content). -->
    <div class="dim-badge" id="dimBadge">-- × -- × -- cm</div>

    <!-- ✅ Anchor points for the on-model dimension sketch — one at each of the 8 bounding-box
         corners (positions set from JS after load, from the model's real bounding box). Every
         frame we read where model-viewer projected these 8 points on screen and use their
         min/max X/Y to draw the lines along the model's actual on-screen silhouette, so the
         sketch stays correctly aligned no matter what angle it's viewed from (front, top-down
         in AR, etc.) instead of being pinned to fixed points that only look right from one side. -->
    <div slot="hotspot-dim-c0" id="dimC0" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c1" id="dimC1" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c2" id="dimC2" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c3" id="dimC3" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c4" id="dimC4" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c5" id="dimC5" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c6" id="dimC6" data-position="0 0 0" data-normal="0 0 1"></div>
    <div slot="hotspot-dim-c7" id="dimC7" data-position="0 0 0" data-normal="0 0 1"></div>

    <svg class="dim-svg" id="dimSvg">
      <!-- Height callout: 2 thin extension lines from the product edge out to the
           dimension line, the dimension line itself, end caps, and a label. -->
      <line id="hExt1" class="dim-ext"></line>
      <line id="hExt2" class="dim-ext"></line>
      <line id="hLine" class="dim-line"></line>
      <line id="hTick1" class="dim-tick"></line>
      <line id="hTick2" class="dim-tick"></line>
      <text id="hLabel" class="dim-label"></text>

      <!-- Width callout -->
      <line id="wExt1" class="dim-ext"></line>
      <line id="wExt2" class="dim-ext"></line>
      <line id="wLine" class="dim-line"></line>
      <line id="wTick1" class="dim-tick"></line>
      <line id="wTick2" class="dim-tick"></line>
      <text id="wLabel" class="dim-label"></text>

      <!-- Depth callout -->
      <line id="dExt1" class="dim-ext"></line>
      <line id="dExt2" class="dim-ext"></line>
      <line id="dLine" class="dim-line"></line>
      <line id="dTick1" class="dim-tick"></line>
      <line id="dTick2" class="dim-tick"></line>
      <text id="dLabel" class="dim-label"></text>
    </svg>
  </model-viewer>

  <!-- ✅ Buttons fixed at bottom (no scroll) -->
  <div class="bottom-bar">
    <a class="btn btn-ar" href="#" onclick="startAR(); return false;">
      View in AR
    </a>

    <a class="btn btn-know" href="https://www.ifbappliances.com/" target="_blank"
       onclick="gtag('event','click_know_more',{event_category:'button',event_label:'Know More'});">
      Know More
    </a>

    <a class="btn btn-demo" href="https://wa.me/918438883817" target="_blank"
       onclick="gtag('event','click_book_demo',{event_category:'button',event_label:'Book Demo WhatsApp'});">
      Book Demo
    </a>
  </div>

  <script>
    const loader = document.getElementById("loader");
    const model = document.getElementById("wmModel");
    const dimBadge = document.getElementById("dimBadge");
    const arBtn = document.querySelector(".btn-ar");

    // ⚠️ TODO: replace with real datasheet values (height x width x depth, cm) and weight (kg)
    // once you have the spec sheet. Until then this reads the live size straight off the
    // 3D model's bounding box, so it stays roughly accurate even with a placeholder model.
    const REAL_DIMENSIONS_CM = null; // e.g. { height: 85, width: 60, depth: 60, weightKg: 62 }

    function updateDimensionBadge() {
      if (REAL_DIMENSIONS_CM) {
        const { height, width, depth, weightKg } = REAL_DIMENSIONS_CM;
        dimBadge.textContent = `H${height} × W${width} × D${depth} cm` +
          (weightKg ? ` · ${weightKg} kg` : "");
        return;
      }
      // Fallback: compute live from the model's actual bounding box (meters -> cm)
      const size = model.getDimensions ? model.getDimensions() : null;
      if (size) {
        const h = Math.round(size.y * 100);
        const w = Math.round(size.x * 100);
        const d = Math.round(size.z * 100);
        dimBadge.textContent = `H${h} × W${w} × D${d} cm (est.)`;
      }
    }

    // ✅ On-model dimension sketch: places anchor points just outside the model's real
    // bounding box, then every frame reads where model-viewer projected them on screen
    // and draws blueprint-style callout lines/ticks/labels between them.
    const cornerEls = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => document.getElementById(`dimC${i}`));

    const hExt1 = document.getElementById("hExt1");
    const hExt2 = document.getElementById("hExt2");
    const hLine = document.getElementById("hLine");
    const hTick1 = document.getElementById("hTick1");
    const hTick2 = document.getElementById("hTick2");
    const hLabel = document.getElementById("hLabel");

    const wExt1 = document.getElementById("wExt1");
    const wExt2 = document.getElementById("wExt2");
    const wLine = document.getElementById("wLine");
    const wTick1 = document.getElementById("wTick1");
    const wTick2 = document.getElementById("wTick2");
    const wLabel = document.getElementById("wLabel");

    const dExt1 = document.getElementById("dExt1");
    const dExt2 = document.getElementById("dExt2");
    const dLine = document.getElementById("dLine");
    const dTick1 = document.getElementById("dTick1");
    const dTick2 = document.getElementById("dTick2");
    const dLabel = document.getElementById("dLabel");

    let dimLoopRunning = false;

    // updateHotspot() (not just setting data-position) is required — model-viewer only
    // reads a hotspot's initial data-position once at creation and ignores later attribute
    // mutations on the slotted element itself. The 8 corner positions are fixed in the
    // model's own local space, so this only needs to run once — model-viewer keeps their
    // on-screen projection in sync with the camera automatically every frame.
    function placeDimensionAnchors() {
      if (!model.getDimensions || !model.getBoundingBoxCenter || !model.updateHotspot) return false;
      const size = model.getDimensions();
      const center = model.getBoundingBoxCenter();
      const hx = size.x / 2, hy = size.y / 2, hz = size.z / 2;
      let i = 0;
      for (const sx of [-1, 1]) {
        for (const sy of [-1, 1]) {
          for (const sz of [-1, 1]) {
            model.updateHotspot({ name: `hotspot-dim-c${i}`, position: `${center.x + sx * hx} ${center.y + sy * hy} ${center.z + sz * hz}` });
            i++;
          }
        }
      }
      return true;
    }

    const AXIS_LABEL = { h: "H", w: "W", d: "D" };
    const AXIS_SPEC_KEY = { h: "height", w: "width", d: "depth" };

    function labelFor(axis, estimateCm) {
      const cm = REAL_DIMENSIONS_CM ? REAL_DIMENSIONS_CM[AXIS_SPEC_KEY[axis]] : estimateCm;
      return `${AXIS_LABEL[axis]} ${cm} cm`;
    }

    function screenPoint(el, mvRect) {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2 - mvRect.left, y: r.top + r.height / 2 - mvRect.top };
    }

    // Corner index for a given (sx, sy, sz) sign triple, matching the fill order in
    // placeDimensionAnchors(): x outer loop, then y, then z.
    const cornerIndex = (sx, sy, sz) => (sx > 0 ? 4 : 0) + (sy > 0 ? 2 : 0) + (sz > 0 ? 1 : 0);

    // Draws one dimension callout: a line parallel to the product edge a→b but pushed
    // `offset` px away from the model, thin extension lines connecting the two, end caps,
    // and a horizontal label. `centerPt` is used to decide which way is "away from the model".
    function drawDim(ext1, ext2, lineEl, t1, t2, labelEl, a, b, centerPt, offset, text) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      let px = -dy / len, py = dx / len;

      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      if ((mx - centerPt.x) * px + (my - centerPt.y) * py < 0) { px = -px; py = -py; }

      const A = { x: a.x + px * offset, y: a.y + py * offset };
      const B = { x: b.x + px * offset, y: b.y + py * offset };

      // Extension lines start slightly off the product so they don't touch it
      const gap = 4;
      ext1.setAttribute("x1", a.x + px * gap); ext1.setAttribute("y1", a.y + py * gap);
      ext1.setAttribute("x2", A.x + px * 4);   ext1.setAttribute("y2", A.y + py * 4);
      ext2.setAttribute("x1", b.x + px * gap); ext2.setAttribute("y1", b.y + py * gap);
      ext2.setAttribute("x2", B.x + px * 4);   ext2.setAttribute("y2", B.y + py * 4);

      lineEl.setAttribute("x1", A.x); lineEl.setAttribute("y1", A.y);
      lineEl.setAttribute("x2", B.x); lineEl.setAttribute("y2", B.y);

      const cap = 5;
      t1.setAttribute("x1", A.x - px * cap); t1.setAttribute("y1", A.y - py * cap);
      t1.setAttribute("x2", A.x + px * cap); t1.setAttribute("y2", A.y + py * cap);
      t2.setAttribute("x1", B.x - px * cap); t2.setAttribute("y1", B.y - py * cap);
      t2.setAttribute("x2", B.x + px * cap); t2.setAttribute("y2", B.y + py * cap);

      labelEl.setAttribute("x", (A.x + B.x) / 2 + px * 16);
      labelEl.setAttribute("y", (A.y + B.y) / 2 + py * 16 + 4); // +4 ≈ half cap-height, vertical centering
      labelEl.setAttribute("text-anchor", "middle");
      labelEl.textContent = text;
    }

    // Every frame: project the 8 bounding-box corners, then pick the single real box EDGE
    // each measurement should sit against — the leftmost vertical edge for height, and the
    // bottom edge nearest the camera for width. Anchoring to one edge (rather than the
    // min/max of the whole projected hull) is what keeps the callouts hugging the product
    // under AR's close camera and wide FOV, where far-side corners project well away from
    // the visible face. Same approach furniture catalogues use for dimension graphics.
    function dimLoop() {
      const mvRect = model.getBoundingClientRect();
      const size = model.getDimensions();
      const pts = cornerEls.map((el) => screenPoint(el, mvRect));

      const centerPt = pts.reduce((acc, p) => ({ x: acc.x + p.x / 8, y: acc.y + p.y / 8 }), { x: 0, y: 0 });

      // Height → the vertical box edge that sits furthest left on screen
      let hA = null, hB = null, bestX = Infinity;
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          const bottom = pts[cornerIndex(sx, -1, sz)];
          const top = pts[cornerIndex(sx, 1, sz)];
          const midX = (bottom.x + top.x) / 2;
          if (midX < bestX) { bestX = midX; hA = top; hB = bottom; }
        }
      }

      // Width → the bottom box edge nearest the camera (lowest on screen)
      let wA = null, wB = null, bestY = -Infinity;
      for (const sz of [-1, 1]) {
        const left = pts[cornerIndex(-1, -1, sz)];
        const right = pts[cornerIndex(1, -1, sz)];
        const midY = (left.y + right.y) / 2;
        if (midY > bestY) { bestY = midY; wA = left; wB = right; }
      }

      // Depth → the bottom edge running front-to-back that sits furthest right on screen.
      // Height takes the left side and width the front, so putting depth on the right keeps
      // the three callouts on separate sides of the product instead of overlapping.
      let dA = null, dB = null, bestDX = -Infinity;
      for (const sx of [-1, 1]) {
        const front = pts[cornerIndex(sx, -1, 1)];
        const back = pts[cornerIndex(sx, -1, -1)];
        const midX = (front.x + back.x) / 2;
        if (midX > bestDX) { bestDX = midX; dA = front; dB = back; }
      }

      drawDim(hExt1, hExt2, hLine, hTick1, hTick2, hLabel,
        hA, hB, centerPt, 26, labelFor("h", Math.round(size.y * 100)));
      drawDim(wExt1, wExt2, wLine, wTick1, wTick2, wLabel,
        wA, wB, centerPt, 26, labelFor("w", Math.round(size.x * 100)));
      drawDim(dExt1, dExt2, dLine, dTick1, dTick2, dLabel,
        dA, dB, centerPt, 26, labelFor("d", Math.round(size.z * 100)));

      requestAnimationFrame(dimLoop);
    }

    model.addEventListener("load", () => {
      loader.style.display = "none";
      updateDimensionBadge();
      if (placeDimensionAnchors() && !dimLoopRunning) {
        dimLoopRunning = true;
        requestAnimationFrame(dimLoop);
      }
      gtag('event','model_loaded',{event_category:'3d',event_label:'IFB_WM'});
    });

    model.addEventListener("ar-status", (event) => {
      if (event.detail.status === "session-started") {
        gtag('event','ar_session_started',{event_category:'AR',event_label:'IFB_WM'});
      }
      if (event.detail.status === "not-presenting") {
        gtag('event','ar_session_ended',{event_category:'AR',event_label:'IFB_WM'});
      }
      if (event.detail.status === "failed") {
        gtag('event','ar_failed',{event_category:'AR',event_label:'IFB_WM'});
        alert("AR couldn't start. Point your camera at a flat, well-lit surface (like a floor) and try again.");
      }
    });

    // Grey out the AR button on devices/browsers that can't do AR at all
    // (desktop, unsupported browsers, iOS Safari without a usdz file, etc.)
    window.addEventListener("load", () => {
      setTimeout(() => {
        if (model.canActivateAR === false) {
          arBtn.classList.add("disabled");
          arBtn.textContent = "AR not supported here";
        }
      }, 800); // model-viewer needs a beat to finish its AR capability check
    });

    function startAR(){
      if (arBtn.classList.contains("disabled")) return;
      gtag('event','click_ar_button',{event_category:'button',event_label:'AR CTA'});
      model.activateAR();
    }
  </script>

</body>
</html>
