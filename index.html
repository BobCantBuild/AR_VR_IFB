<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFB Washing Machine AR</title>

  <!-- ✅ Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QYE6P5SK18"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QYE6P5SK18', { anonymize_ip: true });
  </script>

  <!-- ✅ 3D + AR Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root{
      --bottomBarHeight: 92px; /* space for buttons bar */
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
      overflow: hidden; /* ✅ prevent scrolling */
    }

    h2 { margin: 12px 0 4px; font-size: 18px; }
    p  { margin: 0 0 8px; opacity: 0.85; font-size: 13px; }

    /* ✅ Make model viewer fit into same screen */
    model-viewer {
      width: 100%;
      height: calc(100vh - var(--bottomBarHeight) - 55px);
      background: #111;
    }

    /* ✅ Bottom Fixed Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--bottomBarHeight);
      background: rgba(15, 15, 15, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      z-index: 1000;
    }

    .btn {
      flex: 1;
      padding: 12px 10px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .btn-know {
      background: #ffcc00;
      color: black;
    }

    .btn-demo {
      background: #ffcc00;
      color: black;
    }

    .btn-ar {
      background: #00ff99;
      color: black;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* ✅ Loader Overlay */
    .loader {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 6px solid rgba(255,255,255,0.15);
      border-top: 6px solid #ffcc00;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader span {
      font-size: 14px;
      opacity: 0.85;
    }

    /* ✅ Dimensions badge */
    .dim-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.92);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      padding: 6px 11px;
      border-radius: 999px;
      z-index: 500;
      pointer-events: none;
    }

    .btn-ar.disabled {
      opacity: 0.4;
      animation: none;
      pointer-events: none;
    }

    /* ✅ On-model dimension sketch (height/width callout lines) */
    [slot^="hotspot-dim-"] {
      display: block;
      width: 1px;
      height: 1px;
      border: none;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }

    .dim-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: visible;
    }

    .dim-line, .dim-tick {
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    #heightGroup {
      transition: opacity 0.15s linear;
    }

    .dim-label {
      fill: #ffffff;
      font-size: 11px;
      font-weight: 600;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.6px;
      /* text-anchor and any rotation are set per-label in JS, so no CSS rule here —
         it would win over the attribute. Legibility comes from the feDropShadow on the
         parent group rather than a stroke halo, which read as an outline. */
    }
  </style>
</head>

<body>

  <!-- ✅ Loading screen -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <span>Loading 3D model… Please wait</span>
  </div>

  <h2>IFB Washing Machine - 3D + AR</h2>
  <p>Rotate / Zoom. Tap AR to place it in your room.</p>

  <model-viewer
    id="wmModel"
    src="IFB_WM.glb"
    ar
    ar-modes="webxr scene-viewer"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="30deg"
    shadow-intensity="1"
    shadow-softness="0.8"
    environment-image="neutral"
    exposure="1.1"
    tone-mapping="commerce"
    alt="IFB Washing Machine 3D Model">
    <!-- ✅ Dimensions badge (TEMP values — replace with real datasheet H x W x D + weight, then remove the "computed live" line).
         Lives INSIDE model-viewer so it also renders as an overlay during WebXR AR sessions (only WebXR supports custom
         overlays — Scene Viewer/Quick Look hand off to a native app and can never show page content). -->
    <div class="dim-badge" id="dimBadge">-- × -- × -- cm</div>

    <!-- ✅ Anchor points for the dimension graphics — one at each of the 8 bounding-box corners
         (positions set from JS after load, from the model's real bounding box). Each frame we
         read where model-viewer projected these corners on screen and build the graphics from
         them. data-normal points outward along the corner diagonal. -->
    <div slot="hotspot-dim-c0" id="dimC0" data-position="0 0 0" data-normal="-0.577 -0.577 -0.577"></div>
    <div slot="hotspot-dim-c1" id="dimC1" data-position="0 0 0" data-normal="-0.577 -0.577 0.577"></div>
    <div slot="hotspot-dim-c2" id="dimC2" data-position="0 0 0" data-normal="-0.577 0.577 -0.577"></div>
    <div slot="hotspot-dim-c3" id="dimC3" data-position="0 0 0" data-normal="-0.577 0.577 0.577"></div>
    <div slot="hotspot-dim-c4" id="dimC4" data-position="0 0 0" data-normal="0.577 -0.577 -0.577"></div>
    <div slot="hotspot-dim-c5" id="dimC5" data-position="0 0 0" data-normal="0.577 -0.577 0.577"></div>
    <div slot="hotspot-dim-c6" id="dimC6" data-position="0 0 0" data-normal="0.577 0.577 -0.577"></div>
    <div slot="hotspot-dim-c7" id="dimC7" data-position="0 0 0" data-normal="0.577 0.577 0.577"></div>

    <!-- Width and depth are drawn as a footprint "L" lying on the floor along the two base
         edges meeting at the corner nearest the camera. Only the near two edges are drawn:
         this SVG paints over the render with no depth testing, so the far edges of a full
         rectangle would be stroked straight across the machine's body. Height is the one
         mark that leaves the floor, offset clear of the silhouette. -->
    <svg class="dim-svg" id="dimSvg">
      <defs>
        <filter id="dimShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85" />
        </filter>
      </defs>

      <g id="footprintGroup" filter="url(#dimShadow)">
        <line id="wLine" class="dim-line"></line>
        <line id="wTick1" class="dim-tick"></line>
        <line id="wTick2" class="dim-tick"></line>
        <text id="wLabel" class="dim-label"></text>

        <line id="dLine" class="dim-line"></line>
        <line id="dTick1" class="dim-tick"></line>
        <line id="dTick2" class="dim-tick"></line>
        <text id="dLabel" class="dim-label"></text>
      </g>

      <g id="heightGroup" filter="url(#dimShadow)">
        <line id="hLine" class="dim-line"></line>
        <line id="hTick1" class="dim-tick"></line>
        <line id="hTick2" class="dim-tick"></line>
        <text id="hLabel" class="dim-label"></text>
      </g>
    </svg>
  </model-viewer>

  <!-- ✅ Buttons fixed at bottom (no scroll) -->
  <div class="bottom-bar">
    <a class="btn btn-ar" href="#" onclick="startAR(); return false;">
      View in AR
    </a>

    <a class="btn btn-know" href="https://www.ifbappliances.com/" target="_blank"
       onclick="gtag('event','click_know_more',{event_category:'button',event_label:'Know More'});">
      Know More
    </a>

    <a class="btn btn-demo" href="https://wa.me/918438883817" target="_blank"
       onclick="gtag('event','click_book_demo',{event_category:'button',event_label:'Book Demo WhatsApp'});">
      Book Demo
    </a>
  </div>

  <script>
    const loader = document.getElementById("loader");
    const model = document.getElementById("wmModel");
    const dimBadge = document.getElementById("dimBadge");
    const arBtn = document.querySelector(".btn-ar");

    // ⚠️ TODO: replace with real datasheet values (height x width x depth, cm) and weight (kg)
    // once you have the spec sheet. Until then this reads the live size straight off the
    // 3D model's bounding box, so it stays roughly accurate even with a placeholder model.
    const REAL_DIMENSIONS_CM = null; // e.g. { height: 85, width: 60, depth: 60, weightKg: 62 }

    function updateDimensionBadge() {
      if (REAL_DIMENSIONS_CM) {
        const { height, width, depth, weightKg } = REAL_DIMENSIONS_CM;
        dimBadge.textContent = `H${height} × W${width} × D${depth} cm` +
          (weightKg ? ` · ${weightKg} kg` : "");
        return;
      }
      // Fallback: compute live from the model's actual bounding box (meters -> cm)
      const size = model.getDimensions ? model.getDimensions() : null;
      if (size) {
        const h = Math.round(size.y * 100);
        const w = Math.round(size.x * 100);
        const d = Math.round(size.z * 100);
        dimBadge.textContent = `H${h} × W${w} × D${d} cm (est.)`;
      }
    }

    // ✅ Dimension graphics: anchor points at the model's bounding-box corners, then every
    // frame read where model-viewer projected them and draw the footprint and height line.
    const cornerEls = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => document.getElementById(`dimC${i}`));

    const footprintGroup = document.getElementById("footprintGroup");
    const heightGroup = document.getElementById("heightGroup");

    const hLine = document.getElementById("hLine");
    const hTick1 = document.getElementById("hTick1");
    const hTick2 = document.getElementById("hTick2");
    const hLabel = document.getElementById("hLabel");

    const wLine = document.getElementById("wLine");
    const wTick1 = document.getElementById("wTick1");
    const wTick2 = document.getElementById("wTick2");
    const wLabel = document.getElementById("wLabel");

    const dLine = document.getElementById("dLine");
    const dTick1 = document.getElementById("dTick1");
    const dTick2 = document.getElementById("dTick2");
    const dLabel = document.getElementById("dLabel");

    let dimLoopRunning = false;

    // updateHotspot() (not just setting data-position) is required — model-viewer only
    // reads a hotspot's initial data-position once at creation and ignores later attribute
    // mutations on the slotted element itself. The 8 corner positions are fixed in the
    // model's own local space, so this only needs to run once — model-viewer keeps their
    // on-screen projection in sync with the camera automatically every frame.
    function placeDimensionAnchors() {
      if (!model.getDimensions || !model.getBoundingBoxCenter || !model.updateHotspot) return false;
      const size = model.getDimensions();
      const center = model.getBoundingBoxCenter();
      const hx = size.x / 2, hy = size.y / 2, hz = size.z / 2;
      let i = 0;
      for (const sx of [-1, 1]) {
        for (const sy of [-1, 1]) {
          for (const sz of [-1, 1]) {
            model.updateHotspot({ name: `hotspot-dim-c${i}`, position: `${center.x + sx * hx} ${center.y + sy * hy} ${center.z + sz * hz}` });
            i++;
          }
        }
      }
      return true;
    }

    const AXIS_LABEL = { h: "H", w: "W", d: "D" };
    const AXIS_SPEC_KEY = { h: "height", w: "width", d: "depth" };

    function labelFor(axis, estimateCm) {
      const cm = REAL_DIMENSIONS_CM ? REAL_DIMENSIONS_CM[AXIS_SPEC_KEY[axis]] : estimateCm;
      return `${AXIS_LABEL[axis]} ${cm} cm`;
    }

    function screenPoint(el, mvRect) {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2 - mvRect.left, y: r.top + r.height / 2 - mvRect.top };
    }

    // Corner index for a given (sx, sy, sz) sign triple, matching the fill order in
    // placeDimensionAnchors(): x outer loop, then y, then z.
    const cornerIndex = (sx, sy, sz) => (sx > 0 ? 4 : 0) + (sy > 0 ? 2 : 0) + (sz > 0 ? 1 : 0);

    // Strokes a segment with a short perpendicular tick at each end.
    function strokeSegment(lineEl, t1, t2, A, B, cap) {
      const dx = B.x - A.x, dy = B.y - A.y;
      const len = Math.hypot(dx, dy) || 1;
      const px = -dy / len, py = dx / len;

      lineEl.setAttribute("x1", A.x); lineEl.setAttribute("y1", A.y);
      lineEl.setAttribute("x2", B.x); lineEl.setAttribute("y2", B.y);
      t1.setAttribute("x1", A.x - px * cap); t1.setAttribute("y1", A.y - py * cap);
      t1.setAttribute("x2", A.x + px * cap); t1.setAttribute("y2", A.y + py * cap);
      t2.setAttribute("x1", B.x - px * cap); t2.setAttribute("y1", B.y - py * cap);
      t2.setAttribute("x2", B.x + px * cap); t2.setAttribute("y2", B.y + py * cap);
      return { px, py, len };
    }

    // Places a label beside a segment, rotated to lie along it. Keeping the text on the
    // segment's own angle is what makes the footprint read as lying flat on the floor
    // rather than as a caption floating over the scene. `awayX/awayY` pushes it to the
    // outer side; the glyphs are flipped when the angle would leave them upside down.
    function placeAlignedLabel(labelEl, A, B, awayX, awayY, gap, text) {
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      let angle = Math.atan2(B.y - A.y, B.x - A.x) * 180 / Math.PI;
      if (angle > 90 || angle < -90) angle += 180;

      const x = mx + awayX * gap, y = my + awayY * gap;
      labelEl.setAttribute("x", x);
      labelEl.setAttribute("y", y);
      labelEl.setAttribute("text-anchor", "middle");
      labelEl.setAttribute("transform", `rotate(${angle.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)})`);
      labelEl.textContent = text;
    }

    // Every frame: project the 8 bounding-box corners, then build two graphics from them —
    // a footprint "L" lying on the floor along the two base edges that meet at the corner
    // nearest the camera, and a single height line standing clear of the silhouette.
    //
    // The footprint is drawn directly on its edges with no outward offset, so it reads as
    // marks on the floor the machine is standing on. That anchoring is the point: on a
    // ground plane a small projection error looks like perspective, whereas a line floating
    // beside the product next to nothing reads as misaligned.
    function dimLoop() {
      const mvRect = model.getBoundingClientRect();
      const size = model.getDimensions();
      const pts = cornerEls.map((el) => screenPoint(el, mvRect));

      const centerPt = pts.reduce((acc, p) => ({ x: acc.x + p.x / 8, y: acc.y + p.y / 8 }), { x: 0, y: 0 });

      // Nearest base corner: on a ground plane, nearer points project lower on screen. This
      // is deterministic and moves continuously as the model turns — unlike the occlusion
      // flags this replaces, which flipped abruptly and needed the box inflating to behave.
      let nearSx = -1, nearSz = -1, bestY = -Infinity;
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          const p = pts[cornerIndex(sx, -1, sz)];
          if (p.y > bestY) { bestY = p.y; nearSx = sx; nearSz = sz; }
        }
      }

      const corner = pts[cornerIndex(nearSx, -1, nearSz)];
      const alongW = pts[cornerIndex(-nearSx, -1, nearSz)]; // same depth, opposite width
      const alongD = pts[cornerIndex(nearSx, -1, -nearSz)]; // same width, opposite depth

      // Labels sit on the far side of each edge from the machine's centre, so they fall onto
      // open floor rather than under the body.
      const outward = (A, B) => {
        const dx = B.x - A.x, dy = B.y - A.y;
        const len = Math.hypot(dx, dy) || 1;
        let px = -dy / len, py = dx / len;
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
        if ((mx - centerPt.x) * px + (my - centerPt.y) * py < 0) { px = -px; py = -py; }
        return { px, py, len };
      };

      const wOut = outward(corner, alongW);
      const dOut = outward(corner, alongD);
      const footprintVisible = wOut.len > 26 && dOut.len > 26;
      footprintGroup.style.opacity = footprintVisible ? "1" : "0";
      if (footprintVisible) {
        strokeSegment(wLine, wTick1, wTick2, corner, alongW, 5);
        strokeSegment(dLine, dTick1, dTick2, corner, alongD, 5);
        placeAlignedLabel(wLabel, corner, alongW, wOut.px, wOut.py, 15, labelFor("w", Math.round(size.x * 100)));
        placeAlignedLabel(dLabel, corner, alongD, dOut.px, dOut.py, 15, labelFor("d", Math.round(size.z * 100)));
      }

      // Height → whichever vertical edge projects longest, i.e. the one standing most
      // square-on to the camera, then slid sideways past the whole silhouette so it never
      // crosses the machine.
      let hTop = null, hBottom = null, bestLen = -1;
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          const top = pts[cornerIndex(sx, 1, sz)], bottom = pts[cornerIndex(sx, -1, sz)];
          const l = Math.hypot(top.x - bottom.x, top.y - bottom.y);
          if (l > bestLen) { bestLen = l; hTop = top; hBottom = bottom; }
        }
      }

      const hOut = outward(hBottom, hTop);
      let support = 0;
      for (const q of pts) {
        const d = (q.x - hBottom.x) * hOut.px + (q.y - hBottom.y) * hOut.py;
        if (d > support) support = d;
      }
      const off = support + 20;
      const A = { x: hBottom.x + hOut.px * off, y: hBottom.y + hOut.py * off };
      const B = { x: hTop.x + hOut.px * off, y: hTop.y + hOut.py * off };

      heightGroup.style.opacity = bestLen > 26 ? "1" : "0";
      strokeSegment(hLine, hTick1, hTick2, A, B, 5);

      // Height keeps a horizontal label: the footprint labels rotate because lying along the
      // floor is what sells them as being on the ground, but a vertical line would put this
      // one on its side and make it the hardest number on screen to read.
      const hx = (A.x + B.x) / 2 + hOut.px * 14;
      const hy = (A.y + B.y) / 2 + hOut.py * 14 + 4;
      hLabel.setAttribute("x", hx);
      hLabel.setAttribute("y", hy);
      hLabel.setAttribute("text-anchor", "middle");
      hLabel.removeAttribute("transform");
      hLabel.textContent = labelFor("h", Math.round(size.y * 100));

      requestAnimationFrame(dimLoop);
    }

    model.addEventListener("load", () => {
      loader.style.display = "none";
      updateDimensionBadge();
      if (placeDimensionAnchors() && !dimLoopRunning) {
        dimLoopRunning = true;
        requestAnimationFrame(dimLoop);
      }
      gtag('event','model_loaded',{event_category:'3d',event_label:'IFB_WM'});
    });

    model.addEventListener("ar-status", (event) => {
      if (event.detail.status === "session-started") {
        gtag('event','ar_session_started',{event_category:'AR',event_label:'IFB_WM'});
      }
      if (event.detail.status === "not-presenting") {
        gtag('event','ar_session_ended',{event_category:'AR',event_label:'IFB_WM'});
      }
      if (event.detail.status === "failed") {
        gtag('event','ar_failed',{event_category:'AR',event_label:'IFB_WM'});
        alert("AR couldn't start. Point your camera at a flat, well-lit surface (like a floor) and try again.");
      }
    });

    // Grey out the AR button on devices/browsers that can't do AR at all
    // (desktop, unsupported browsers, iOS Safari without a usdz file, etc.)
    window.addEventListener("load", () => {
      setTimeout(() => {
        if (model.canActivateAR === false) {
          arBtn.classList.add("disabled");
          arBtn.textContent = "AR not supported here";
        }
      }, 800); // model-viewer needs a beat to finish its AR capability check
    });

    function startAR(){
      if (arBtn.classList.contains("disabled")) return;
      gtag('event','click_ar_button',{event_category:'button',event_label:'AR CTA'});
      model.activateAR();
    }
  </script>

</body>
</html>
